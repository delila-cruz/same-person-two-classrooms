<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Same Person, Two Classrooms</title>
  <link rel="stylesheet" href="style.css" />
  <!--
    Minimal inline fallback so the two-panel grid is visible even before
    style.css gets its real palette pass. The real styling (colors, fonts,
    locked-option hover states, etc.) lands later — this is just enough
    structure to see "two equal columns with a thin separator" today.
  -->
  <style>
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      color: #000;
      background: #fff;
    }

    #stage {
      min-height: 100vh;
      box-sizing: border-box;
      padding: 2rem;
    }

    /* Single centered block, used by title + narration scenes */
    .single-block {
      max-width: 40rem;
      margin: 0 auto;
      text-align: center;
    }

    /* Two-panel grid shell, used by later scene types
       (staggeredNarration, lockedChoice, multiRoundLockedChoice, outcome) */
    .two-panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 2rem;
      position: relative;
    }

    .two-panel-grid::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: #000;
      opacity: 0.3;
    }

    .panel {
      padding: 1rem;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem 1.5rem;
      margin-top: 1.5rem;
      cursor: pointer;
      background: #fff;
      color: #000;
      border: 1px solid #000;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main id="stage">
    <!-- renderScene() clears and fills this container -->
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
